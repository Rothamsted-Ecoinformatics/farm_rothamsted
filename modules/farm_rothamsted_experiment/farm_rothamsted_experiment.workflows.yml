rothamsted_experiment_plan:
  id: rothamsted_experiment_plan
  group: plan
  label: 'Rothamsted Experiment'
  states:
    requested:
      label: Requested
    planning:
      label: Planning
    active:
      label: Active
    completed:
      label: Completed
    cancelled:
      label: Cancelled
  transitions:
    to_requested:
      label: 'Set status to requested'
      from: [ active,completed,cancelled,planning]
      to: requested
    to_planning:
      label: 'Set status to planning'
      from: [ active,completed,cancelled,requested ]
      to: planning
    to_active:
      label: 'Make active'
      from: [ planning,completed,cancelled,requested ]
      to: active
    complete:
      label: 'Set status to complete'
      from: [ planning,active,cancelled,requested ]
      to: completed
    cancel:
      label: 'Cancel'
      from: [ planning,active,completed,requested ]
      to: cancelled
